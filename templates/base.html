{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Portofolio profesional Adit Setya Nugroho, seorang Blue Team Security Engineer yang berfokus pada IDPS Snort 3, monitoring SSH Brute Force, dan keamanan jaringan."
    />
    <meta
      name="keywords"
      content="Adit Setya Nugroho, Aaditan, Cybersecurity, Blue Team, Security Engineer, IDPS Snort 3, Network Security, Splunk"
    />
    <meta name="author" content="Adit Setya Nugroho" />

    <meta
      name="google-site-verification"
      content="rNfl0yyPFwnXi3-PAxupWv9dQAuH0Vry5bHPPqzUJiM"
    />

    <!-- Title diubah menjadi Nama Lengkap agar muncul di Google -->
    <title>Adit Setya Nugroho | Blue Team Security Engineer</title>

    <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=6" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>

  <body>
    <header>
      <div class="navbar">
        <a href="{% url 'home' %}" class="nav-logo">
          <img
            src="{% static 'images/logo.png' %}"
            alt="Logo Adit Setya Nugroho"
            style="height: 35px; width: auto; margin-right: 10px"
          />
          <!-- Tetap gunakan Aaditan jika ingin branding, tapi pastikan teks h1 di home.html berisi nama lengkap -->
          Aaditan
        </a>

        <nav>
          <a href="{% url 'home' %}">Home</a>
          <a href="{% url 'about' %}">About</a>
          <a href="{% url 'skills' %}">Skills</a>
          <a href="{% url 'projects' %}">Projects</a>
        </nav>
      </div>
    </header>

    {% block content %}{% endblock %}

    <footer>
      <!-- Menambahkan Nama Lengkap di Footer membantu penguatan kata kunci di seluruh halaman -->
      <p>
        &copy; 2026 Adit Setya Nugroho (Aaditan). Built with Django, Python &
        Caffeine.
      </p>
    </footer>

    {% block floating_ui %}
    <!-- (Bagian floating_ui tetap sama) -->
    <div class="lang-switch-container">
      <button id="langToggle" class="btn-lang" onclick="toggleLanguage()">
        <span class="active">ID</span>
        <span class="divider">/</span>
        <span>EN</span>
      </button>
    </div>

    <div class="contact-dock">
      <div class="dock-status">
        <span class="pulse-dot"></span>
        <span class="status-text">Available for Collaboration</span>
      </div>
      <div class="dock-divider"></div>
      <div class="dock-icons">
        <a
          href="https://wa.me/628895759084"
          target="_blank"
          class="dock-link"
          title="WhatsApp"
          ><i class="fab fa-whatsapp"></i
        ></a>
        <a href="mailto:aditsetyan884@gmail.com" class="dock-link" title="Email"
          ><i class="fas fa-envelope"></i
        ></a>
        <a
          href="https://www.linkedin.com/in/aditsetyanugroho/"
          target="_blank"
          class="dock-link"
          title="LinkedIn"
          ><i class="fab fa-linkedin"></i
        ></a>
        <a
          href="https://github.com/aditsetyan"
          target="_blank"
          class="dock-link"
          title="GitHub"
          ><i class="fab fa-github"></i
        ></a>
      </div>
    </div>
    {% endblock %}

    <script src="{% static 'js/script.js' %}?v=6"></script>
  </body>
</html>
